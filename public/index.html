<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useMemo, memo } = React;


function toPascal(name) {
  return String(name)
    .split(/[-_ ]+/)
    .filter(Boolean)
    .map(w => w[0].toUpperCase() + w.slice(1).toLowerCase())
    .join('');
}
const Icon = memo(function Icon({ name, size = 16, strokeWidth = 2, style }) {
  const ref = useRef(null);
  const [, force] = useState(0);
  useEffect(() => {
    const draw = () => {
      const lib = window.lucide;
      if (!ref.current || !lib || !lib.icons) return false;
      const key = toPascal(name);
      const def = lib.icons[key] || lib.icons[name];
      if (!def) return false;
      const node = lib.createElement(def);
      node.setAttribute('width', size);
      node.setAttribute('height', size);
      node.setAttribute('stroke-width', strokeWidth);
      ref.current.replaceChildren(node);
      return true;
    };
    if (draw()) return;
    let tries = 0;
    const t = setInterval(() => {
      tries++;
      if (draw() || tries > 80) clearInterval(t);
    }, 30);
    return () => clearInterval(t);
  }, [name, size, strokeWidth]);
  return <span ref={ref} style={{ display: 'inline-flex', width: size, height: size, ...style }} />;
});


const GitHubIcon = memo(function GitHubIcon({ size = 16, style }) {
  return (
    <svg
      width={size} height={size} viewBox="0 0 24 24"
      fill="currentColor" aria-hidden="true"
      style={{ display: 'inline-block', verticalAlign: 'middle', flexShrink: 0, ...style }}>
      <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z" />
    </svg>
  );
});





const BASE = "https://anya-github-stats.vercel.app/api/stats";
const THEMES = {
  "🌑 Dark Dev": ["dark", "github_dark", "tokyonight", "dracula", "nord", "solarized", "monokai"],
  "🌌 Futuristic": ["cyberpunk", "midnight", "ocean_dark", "neon_dreams", "galaxy", "aurora", "starlight"],
  "☀️ Light": ["light", "github_light"],
  "🌸 Pastel": ["sakura","rose_gold","lavender","cotton_candy","mint_fresh","peach_blossom","bubblegum","sunshine","ocean_breeze","cherry_blossom"],
};
const HIDE_STATS = ["repos","stars","forks","commits","prs","issues","reviews","followers","following","gists","watchers"];

function buildStatsUrl(s) {
  const p = new URLSearchParams();
  p.set("username", s.username);
  if (s.theme !== "dark") p.set("theme", s.theme);
  if (!s.showIcons) p.set("show_icons", "false");
  if (s.compact) p.set("compact", "true");
  if (s.borderRadius !== 10) p.set("border_radius", String(s.borderRadius));
  if (s.hidden.size) p.set("hide", [...s.hidden].join(","));
  return `${BASE}?${p.toString()}`;
}


const PETAL_SHAPES = ['✿','❀','✾','✽','🌸'];
function SakuraPetals({ count = 14 }) {
  const petals = useMemo(() => Array.from({ length: count }, (_, i) => ({
    id: i,
    left: `${(i * 7.3 + 3) % 100}%`,
    size: 12 + (i % 5) * 4,
    duration: 7 + (i % 6) * 1.5,
    swayDuration: 3 + (i % 4) * 0.8,
    delay: -(i * 1.1),
    opacity: 0.35 + (i % 3) * 0.15,
    shape: PETAL_SHAPES[i % PETAL_SHAPES.length],
    color: ['oklch(0.78 0.14 350)','oklch(0.82 0.13 345)','oklch(0.85 0.11 25)','oklch(0.72 0.17 355)'][i % 4],
  })), [count]);
  return (
    <>
      {petals.map(p => (
        <span key={p.id} className="sakura-petal" style={{
          left: p.left,
          fontSize: p.size,
          color: p.color,
          opacity: p.opacity,
          animationDuration: `${p.duration}s, ${p.swayDuration}s`,
          animationDelay: `${p.delay}s, ${p.delay * 0.5}s`,
        }}>{p.shape}</span>
      ))}
    </>
  );
}

const PLACEHOLDERS = ["Enter Your Username", "Itz-Anya", "Itz-Murali"];

function HeroStep({ onSubmit }) {
  const [value, setValue] = useState("");
  const [error, setError] = useState("");
  const [phIdx, setPhIdx] = useState(0);

  useEffect(() => {
    const t = setInterval(() => setPhIdx(i => (i + 1) % PLACEHOLDERS.length), 3200);
    return () => clearInterval(t);
  }, []);

  const handleSubmit = (e) => {
    e?.preventDefault();
    const v = value.trim().replace(/^@/, "");
    if (!v) return setError("Please enter a GitHub username");
    if (!/^[a-zA-Z0-9-]{1,39}$/.test(v)) return setError("Invalid GitHub username");
    setError(""); onSubmit(v);
  };

  return (
    <section className="relative flex min-h-[100svh] flex-col items-center justify-center overflow-hidden px-6 py-12">
      <SakuraPetals count={16} />
      <div className="pointer-events-none absolute inset-0 opacity-50" style={{
        backgroundImage: "linear-gradient(oklch(0.78 0.14 350 / 0.08) 1px, transparent 1px), linear-gradient(90deg, oklch(0.78 0.14 350 / 0.08) 1px, transparent 1px)",
        backgroundSize: "44px 44px",
        maskImage: "radial-gradient(ellipse 80% 70% at 50% 50%, black, transparent)",
      }} />
      <div className="pointer-events-none absolute left-1/2 top-1/2 h-[420px] w-[420px] -translate-x-1/2 -translate-y-1/2 rounded-full opacity-60"
        style={{ background: "radial-gradient(circle, oklch(0.85 0.12 345 / 0.45), transparent 70%)", filter: 'blur(40px)', willChange: 'opacity' }} />

      <div className="relative z-10 mx-auto w-full max-w-lg animate-float-in">
        
        <div className="mb-7 flex justify-center">
          <span className="inline-flex items-center gap-2 rounded-full border bg-[color:var(--sakura-soft)]/60 px-4 py-1.5 font-mono text-[0.65rem] uppercase tracking-[0.22em] backdrop-blur"
            style={{ borderColor: 'oklch(0.78 0.14 350 / 0.4)', color: 'var(--sakura-deep)' }}>
            <Icon name="sparkles" size={12} />
            GitHub Stats Generator
          </span>
        </div>

        <h1 className="text-center font-display font-extrabold leading-[0.95] tracking-tight" style={{ fontSize: 'clamp(3rem,12vw,4.5rem)' }}>
          GitHub <span className="gradient-text">Stats</span>
        </h1>
        <p className="mt-4 text-center font-mono text-sm text-muted-foreground">// craft your blossoming dev identity card</p>

        <form onSubmit={handleSubmit} className="mt-10 space-y-3">
          <div className="relative">
            
            <input
              type="text" value={value}
              onChange={(e) => { setValue(e.target.value); if (error) setError(""); }}
              placeholder={PLACEHOLDERS[phIdx % PLACEHOLDERS.length]}
              autoComplete="off" autoCorrect="off" autoCapitalize="off" spellCheck={false} 
              className="w-full rounded-xl border-2 bg-white px-12 py-4 font-mono text-base tracking-wide text-black backdrop-blur transition-all focus:outline-none"
              style={{ borderColor: 'var(--border)' }}
              onFocus={e => e.target.style.borderColor = 'var(--sakura)'}
              onBlur={e => e.target.style.borderColor = 'var(--border)'}
            />
          </div>

          <button type="submit"
            className="btn-blossom flex w-full items-center justify-center gap-2 rounded-xl px-6 py-4 font-display text-base font-bold tracking-wide text-white transition-all hover:-translate-y-0.5 active:translate-y-0"
            style={{ background: "var(--gradient-sakura)", boxShadow: 'var(--shadow-petal)' }}>
            Generate My Stats <Icon name="arrow-right" size={18} />
          </button>

          <p className="min-h-5 text-center text-xs text-destructive" role="alert">{error}</p>
        </form>

        <p className="mt-8 text-center font-mono text-[0.7rem] uppercase tracking-[0.25em] text-muted-foreground">
          ✿ powered by anya & murali ✿
        </p>
      </div>
    </section>
  );
}

function ToggleRow({ label, sub, checked, onChange, icon }) {

    <div className="flex items-center justify-between border-b py-3 last:border-b-0" style={{ borderColor: 'var(--border)' }}>

        <div>

function Snippet({ label, value, copied, onCopy }) {
  return (
    <div className="mb-2.5 last:mb-0">

        <button onClick={onCopy} className="inline-flex items-center gap-1 rounded-md px-2 py-1 font-mono text-[0.7rem] transition-all"
          style={{
            background: copied ? 'oklch(0.7 0.16 155 / 0.15)' : 'var(--muted)',
            color: copied ? 'var(--success)' : 'var(--muted-foreground)',

        {value}
      </pre>
    </div>

}


function CustomizeStep({ username, onChangeUser }) {
  const [state, setState] = useState({
    username, theme: "sakura", showIcons: true, compact: false, borderRadius: 14, hidden: new Set(),
  });
  const [status, setStatus] = useState("loading");
  const [previewUrl, setPreviewUrl] = useState(() => buildStatsUrl({
    username, theme: "sakura", showIcons: true, compact: false, borderRadius: 14, hidden: new Set(),
  }));
  const [copiedKey, setCopiedKey] = useState(null);
  const debounceRef = useRef(null);

  useEffect(() => {
    if (debounceRef.current) clearTimeout(debounceRef.current);
    setStatus("loading");
    debounceRef.current = setTimeout(() => setPreviewUrl(buildStatsUrl(state)), 280);
    return () => debounceRef.current && clearTimeout(debounceRef.current);
  }, [state]);

  const update = (k, v) => setState(s => ({ ...s, [k]: v }));
  const toggleHidden = (stat) => setState(s => {
    const next = new Set(s.hidden);
    next.has(stat) ? next.delete(stat) : next.add(stat);
    return { ...s, hidden: next };
  });
  const copy = async (key, text) => {
    try { await navigator.clipboard.writeText(text); setCopiedKey(key); setTimeout(() => setCopiedKey(null), 1800); } catch {}
  };

  const finalUrl = buildStatsUrl(state);
  const markdown = `![${state.username}'s GitHub Stats](${finalUrl})`;
  const html = `<a href="https://github.com/${state.username}"><img src="${finalUrl}" alt="${state.username}'s GitHub Stats" /></a>`;

  return (
    <section className="animate-slide-up flex min-h-[100svh] flex-col">
      <header className="sticky top-0 z-40 flex items-center justify-between border-b px-5 py-3 backdrop-blur-xl sm:px-8" style={{ borderColor: 'var(--border)', background: 'oklch(0.985 0.012 350 / 0.7)' }}>
        <div className="flex items-center gap-2">
          
        		
        	<span className="font-display text-base font-bold gradient-text">GitHub Stats</span>
        </div>
        <button onClick={onChangeUser}
          className="inline-flex items-center gap-1.5 rounded-full border bg-card/60 px-3 py-1.5 font-mono text-[0.7rem] uppercase tracking-wider text-muted-foreground transition-all hover:text-foreground"
          style={{ borderColor: 'var(--border)' }}>
          <Icon name="arrow-left" size={12} /> Change user
        </button>
      </header>

      <div className="px-5 py-6 sm:px-8">
        <div className="mb-3 flex items-center justify-between">
          <span className="font-mono text-[0.7rem] uppercase tracking-[0.2em] text-muted-foreground">✿ @{state.username}</span>
          <span className="font-mono text-[0.7rem] uppercase tracking-[0.2em] text-muted-foreground">{state.theme.replace(/_/g, " ")}</span>
        </div>
        <div className="card-shimmer relative rounded-2xl p-[3px]" style={{ boxShadow: 'var(--shadow-glow)' }}>
          <div className="relative flex min-h-[180px] items-center justify-center overflow-hidden rounded-[14px] bg-card">
            {status === "loading" && <div className="skeleton-shimmer absolute inset-0 rounded-[14px]" />}
            {status === "error" && (
              <div className="p-6 text-center text-sm text-muted-foreground">
                <Icon name="image" size={28} /><br />
                Could not load stats.<br />Check the username and try again.
              </div>
            )}
            <img key={previewUrl} src={previewUrl} alt={`${state.username}'s GitHub Stats Card`}
              onLoad={() => setStatus("ready")} onError={() => setStatus("error")}
              className="block w-full rounded-[14px]"
              style={{ display: status === "ready" ? "block" : "none" }} />
          </div>
        </div>
      </div>

      <div className="scrollbar-thin flex-1 space-y-7 overflow-y-auto px-5 pb-32 sm:px-8">
        <Panel label="Theme" icon={<Icon name="sparkles" size={12} />}>
          <div className="space-y-3">
            {Object.entries(THEMES).map(([group, themes]) => (
              <div key={group}>
                <div className="mb-2 font-mono text-[0.7rem] tracking-wide text-muted-foreground">{group}</div>
                <div className="scrollbar-hide flex gap-2 overflow-x-auto pb-1">
                  {themes.map(t => {
                    const active = t === state.theme;
                    return (
                      <button key={t} onClick={() => update("theme", t)}
                        className="flex-shrink-0 whitespace-nowrap rounded-full border-[1.5px] px-3.5 py-1.5 font-mono text-[0.72rem] tracking-wide transition-all"
                        style={{
                          borderColor: active ? 'var(--sakura-deep)' : 'var(--border)',
                          background: active ? 'var(--sakura-soft)' : 'oklch(1 0.005 340 / 0.5)',
                          color: active ? 'var(--sakura-deep)' : 'var(--muted-foreground)',
                          boxShadow: active ? '0 0 12px oklch(0.72 0.17 350 / 0.3)' : 'none',
                        }}>
                        {t.replace(/_/g, " ")}
                      </button>
                    );
                  })}
                </div>
              </div>
            ))}
          </div>
        </Panel>

        <Panel label="Options" icon={<Icon name="layout-grid" size={12} />}>
          <ToggleRow label="Show Icons" sub="Display stat icons on card" checked={state.showIcons} onChange={v => update("showIcons", v)} icon={<Icon name={state.showIcons ? "eye" : "eye-off"} size={14} />} />
          <ToggleRow label="Compact Mode" sub="Smaller, condensed card layout" checked={state.compact} onChange={v => update("compact", v)} icon={<Icon name="layout-grid" size={14} />} />
        </Panel>

        <Panel label="Border Radius">
          <div className="flex items-center gap-3">
            <input type="range" min={0} max={28} value={state.borderRadius}
              onChange={e => update("borderRadius", parseInt(e.target.value))}
              className="flex-1" style={{ height: 6, accentColor: 'var(--sakura-deep)' }} />
            <div className="min-w-9 rounded-md px-2 py-0.5 text-center font-mono text-xs font-semibold" style={{ background: 'var(--sakura-soft)', color: 'var(--sakura-deep)' }}>{state.borderRadius}</div>
          </div>
        </Panel>

        <Panel label="Hide Stats" icon={<Icon name="eye-off" size={12} />}>
          <div className="flex flex-wrap gap-2">
            {HIDE_STATS.map(stat => {
              const active = state.hidden.has(stat);
              return (
                <button key={stat} onClick={() => toggleHidden(stat)}
                  className="rounded-lg border-[1.5px] px-3 py-1.5 font-mono text-[0.7rem] tracking-wide transition-all"
                  style={{
                    borderColor: active ? 'var(--sakura-deep)' : 'var(--border)',
                    background: active ? 'var(--sakura-soft)' : 'oklch(1 0.005 340 / 0.4)',
                    color: active ? 'var(--sakura-deep)' : 'var(--muted-foreground)',
                  }}>
                  {stat}
                </button>
              );
            })}
          </div>
        </Panel>

        <Panel label="Embed Snippets" icon={<Icon name="code" size={12} />}>
          <Snippet label="Direct URL" value={finalUrl} copied={copiedKey === "url"} onCopy={() => copy("url", finalUrl)} />
          <Snippet label="Markdown" value={markdown} copied={copiedKey === "md"} onCopy={() => copy("md", markdown)} />
          <Snippet label="HTML" value={html} copied={copiedKey === "html"} onCopy={() => copy("html", html)} />
        </Panel>
      </div>

      <div className="fixed bottom-0 left-1/2 z-50 w-full max-w-2xl -translate-x-1/2 border-t px-5 py-3 backdrop-blur-xl sm:px-8" style={{ borderColor: 'var(--border)', background: 'oklch(0.985 0.012 350 / 0.85)' }}>
        <div className="flex gap-2">
          <button onClick={() => copy("bar-url", finalUrl)}
            className="flex flex-1 items-center justify-center gap-1.5 rounded-xl border-[1.5px] bg-card/60 px-4 py-3 font-mono text-[0.78rem] font-medium text-foreground transition-all"
            style={{ borderColor: copiedKey === "bar-url" ? 'var(--success)' : 'var(--border)', color: copiedKey === "bar-url" ? 'var(--success)' : 'var(--foreground)' }}>
            <Icon name={copiedKey === "bar-url" ? "check" : "copy"} size={14} />
            {copiedKey === "bar-url" ? "Copied!" : "Copy URL"}
          </button>
          <button onClick={() => copy("bar-md", markdown)}
            className="flex flex-1 items-center justify-center gap-1.5 rounded-xl px-4 py-3 font-display text-[0.82rem] font-bold tracking-wide text-white transition-all hover:-translate-y-0.5"
            style={{ background: "var(--gradient-sakura)", boxShadow: 'var(--shadow-petal)' }}>
            <Icon name={copiedKey === "bar-md" ? "check" : "copy"} size={14} />
            {copiedKey === "bar-md" ? "Copied!" : "Copy Markdown"}
          </button>
        </div>
      </div>
    </section>
  );
}
